[project]
name = "life-archive"
version = "0.1.0"
description = "Complete digital life research and publishing platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "neo4j>=5.21.0",
    "meilisearch>=0.31.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "structlog>=24.1.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pillow>=10.4.0",
    "pytesseract>=0.3.10",
    "ffmpeg-python>=0.2.0",
    "mutagen>=1.47.0",
    "xxhash>=3.4.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]
ml = [
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
]

[project.scripts]
life-archive = "life_archive.cli:app"

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The package lives under python/; without this, flat-layout auto-discovery
# picks up the empty src/ skeleton and misses life_archive entirely.
where = ["python"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
