version: "3.8"

services:
  postgres:
    image: postgres:14
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: postgreS123 # Replace with a strong password
      POSTGRES_DB: n8n
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_network
networks:
  n8n_network:
    driver: bridge

volumes:
  postgres_data:
