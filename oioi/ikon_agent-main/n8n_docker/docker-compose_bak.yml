version: "3.8"

services:
  postgres:
    image: postgres:14
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: postgreS123 # Replace with a strong password
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=keross
      - N8N_BASIC_AUTH_PASSWORD=Keross@123
      - N8N_HOST=ikoncloud-dev.keross.com
      - N8N_PORT=5666
      - N8N_PROTOCOL=https
      - NODE_FUNCTION_ALLOW_EXTERNAL=lodash
      - N8N_SECURE_COOKIE=false
      - N8N_PATH=/n8n/
      - WEBHOOK_URL=https://ikoncloud-dev.keross.com/n8n/
      - NODE_ENV=production

      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=postgreS123

      # Encryption Key
      - N8N_ENCRYPTION_KEY=f6eBFGxg0CZRsf2gTh9azUifr+a2/KCtDVT+8nXwbDA=
    ports:
      - "5666:5666" # Expose n8n on port 5678
    volumes:
      - /root/n8n_docker/n8n:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - n8n_network

networks:
  n8n_network:
    driver: bridge

volumes:
  postgres_data:
